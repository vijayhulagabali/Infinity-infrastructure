<!DOCTYPE html>
<html>
<head>
  <title>Temporarily Unavailable</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .box {
      background: white;
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      max-width: 500px;
    }
    h1 { color: #d32f2f; }
    p { color: #555; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Website Temporarily Unavailable</h1>
    <p>This website has been temporarily suspended due to pending payment.</p>
    <p>Please contact the developer to restore access.</p>
  </div>
</body>
</html>
